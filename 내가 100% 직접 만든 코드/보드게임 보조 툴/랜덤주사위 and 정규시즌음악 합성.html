<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Game Support System</title>
    <style>
        body { background-color: green; }
        body { font-family: Arial, sans-serif; text-align: center; margin: 20px; }
        h1 { margin-bottom: 20px; }
        .button-container { display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px; justify-content: center; }
        button { padding: 20px 30px; font-size: 16px; cursor: pointer; background-color: #007BFF; color: white; border: none; border-radius: 5px; }
        button:hover { background-color: #0056b3; }
        .container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 20px; }
        .box { border: 1px solid #ccc; padding: 10px; border-radius: 10px; background-color: #f9f9f9; min-height: 120px; }
        .fileList { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; padding: 10px; }
        .fileList button { font-size: 14px; padding: 5px; }
    </style>

    <script>
        function updateResult(result) {
            document.getElementById("result").innerHTML = result;
        }

        // normal 랜덤 자원 득점
        function normalScore(k) {
            let T = [];
            for (let i = 0; i < k; i++) {
                T.push(Math.floor(Math.random() * 6) + 1);
            }
            const score = T.filter(x => x === 1).length + T.filter(x => x === 4).length;
            updateResult(`주사위 결과: ${T.join(", ")}<br>득점: <span style="font-size: 3em; color: yellow;">${score}</span>`);
        }

        // weak 랜덤 자원 득점
        function weakScore(k) {
            let T = [];
            for (let i = 0; i < k; i++) {
                T.push(Math.floor(Math.random() * 6) + 1);
            }
            const score = T.filter(x => x === 1).length;
            updateResult(`주사위 결과: ${T.join(", ")}<br>득점: <span style="font-size: 3em; color: yellow;">${score}</span>`);
        }

        // strong 랜덤 자원 득점
        function strongScore(k) {
            let T = [];
            for (let i = 0; i < k; i++) {
                T.push(Math.floor(Math.random() * 6) + 1);
            }
            const score = T.filter(x => x === 1).length + (2 * T.filter(x => x === 4).length);
            updateResult(`주사위 결과: ${T.join(", ")}<br>득점: <span style="font-size: 3em; color: yellow;">${score}</span>`);
        }

        // 합
        function summationDice(k) {
            let T = [];
            for (let i = 0; i < k; i++) {
                T.push(Math.floor(Math.random() * 6) + 1);
            }
            const sum = T.reduce((sum, x) => sum + x, 0);
            updateResult(`주사위 결과: ${T.join(", ")}<br>합: <span style="font-size: 3em; color: yellow;">${sum}</span>`);
        }

        // 주사위 몇 개 던지기
        function diceDraw(k) {
            let T = [];
            for (let i = 0; i < k; i++) {
                T.push(Math.floor(Math.random() * 6) + 1);
            }
            updateResult(`주사위 결과: <span style="font-size: 1.5em; color: yellow;">${T.join(", ")}</span>`);
        }

        // target number
        function targetNumber(a, b) {
            let min = Math.min(a, b);
            let max = Math.max(a, b);
            const randomNum = Math.floor(Math.random() * (max - min + 1)) + min;
            updateResult(`랜덤 숫자: <span style="font-size: 3em; color: yellow;">${randomNum}</span>`);
        }

        // 키보드 단축키 이벤트 리스너 추가
        document.addEventListener("keydown", function(event) {
            const key = event.key.toLowerCase(); // 입력된 키를 소문자로 변환
            if (key === "n") {
                normalScore(prompt("일반 랜덤 자원 득점 : 몇 개의 주사위를 던지겠습니까? (숫자 입력)"));
            } else if (key === "w") {
                weakScore(prompt("약한 랜덤 자원 득점 : 몇 개의 주사위를 던지겠습니까? (숫자 입력)"));
            } else if (key === "s") {
                strongScore(prompt("강한 랜덤 자원 득점 : 몇 개의 주사위를 던지겠습니까? (숫자 입력)"));
            } else if (key === "m") {
                summationDice(prompt("주사위 합계 : 몇 개의 주사위를 던지겠습니까? (숫자 입력)"));
            } else if (key === "d") {
                diceDraw(prompt("주사위 걍 던지기 : 몇 개의 주사위를 던지겠습니까? (숫자 입력)"));
            } else if (key === "t") {
                targetNumber(
                    prompt("첫 번째 숫자를 입력하세요."),
                    prompt("두 번째 숫자를 입력하세요.")
                );
            }
        });
    </script>

    <script>
        let currentAudio = null;
        let globalVolume = 0.25; // 기본 음량 (25%)
        let timeUpdater;

        function selectFolder(boxId) {
            document.getElementById(`folderInput${boxId}`).click();
        }

        function loadFiles(event, boxId) {
            const files = Array.from(event.target.files);
            const fileListDiv = document.querySelector(`#box${boxId} .fileList`);
            fileListDiv.innerHTML = "";

            const mp3Files = files.filter(file => file.name.toLowerCase().endsWith(".mp3"));

            if (mp3Files.length === 0) {
                fileListDiv.innerHTML = "<p>MP3 파일이 없습니다.</p>";
                return;
            }

            mp3Files.forEach(file => {
                const fileURL = URL.createObjectURL(file);
                const btn = document.createElement("button");
                btn.textContent = file.name;
                btn.onclick = () => playAudio(fileURL);
                fileListDiv.appendChild(btn);
            });
        }

        function playAudio(src) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            currentAudio = new Audio(src);
            currentAudio.volume = globalVolume;
            currentAudio.play();
            
            currentAudio.onloadedmetadata = () => {
                updateTimeDisplay();
                timeUpdater = setInterval(updateTimeDisplay, 1000);
            };
            
            currentAudio.onended = () => {
                document.getElementById("timeDisplay").textContent = "0:00";
                clearInterval(timeUpdater);
            };
        }

        function updateTimeDisplay() {
            if (currentAudio) {
                const remainingTime = Math.max(0, currentAudio.duration - currentAudio.currentTime);
                const minutes = Math.floor(remainingTime / 60);
                const seconds = Math.floor(remainingTime % 60);
                document.getElementById("timeDisplay").innerHTML = `<span style="font-size: 2.5em; color: red;">${minutes}:${seconds.toString().padStart(2, "0")}</span>`;

                if (remainingTime <= 0) {
                    document.getElementById("timeDisplay").textContent = "0:00";
                    clearInterval(timeUpdater);
                }
            }
        }

        function changeVolume(value) {
            globalVolume = value / 100;
            if (currentAudio) {
                currentAudio.volume = globalVolume;
            }
            document.getElementById("volumeLabel").textContent = `${value}%`;
        }

        const volumeSlider = document.getElementById("volumeSlider");
        const volumeLabel = document.getElementById("volumeLabel");

        volumeSlider.addEventListener("input", (event) => {
            globalVolume = event.target.value / 100;
            volumeLabel.textContent = `${event.target.value}%`;
            if (currentAudio) {
                currentAudio.volume = globalVolume;
            }
        });

        document.addEventListener("keydown", (event) => {
            let value = parseInt(volumeSlider.value);
            if (event.key === "ArrowRight" && value < 100) {
                value += 5;
            } else if (event.key === "ArrowLeft" && value > 0) {
                value -= 5;
            }
            volumeSlider.value = value;
            volumeLabel.textContent = `${value}%`;
            globalVolume = value / 100;
            if (currentAudio) {
                currentAudio.volume = globalVolume;
            }
        });

    </script>

</head>
<body>
    <h1>Board Game Support System</h1>
    
    <!-- 보드게임 플레이 도구 -->
    <h2>Dice Game Functions</h2>
    <div class="button-container">
        <button onclick="normalScore(prompt('몇 개의 주사위를 던지겠습니까?'))">Normal Score (N)</button>
        <button onclick="weakScore(prompt('몇 개의 주사위를 던지겠습니까?'))">Weak Score (W)</button>
        <button onclick="strongScore(prompt('몇 개의 주사위를 던지겠습니까?'))">Strong Score (S)</button>
        <button onclick="summationDice(prompt('몇 개의 주사위를 던지겠습니까?'))">Summation Dice (M)</button>
        <button onclick="diceDraw(prompt('몇 개의 주사위를 던지겠습니까?'))">Dice Draw (D)</button>
        <button onclick="targetNumber(prompt('첫 번째 숫자 입력'), prompt('두 번째 숫자 입력'))">Target Number (T)</button>
    </div>
    <div id="result">결과가 여기에 표시됩니다.</div>

    <hr>

    <!-- MP3 재생 기능 -->
    <div class="control-panel">
        <button onclick="stopAudio()">⏹️ Stop (P)</button>
    </div>
    <p>남은 시간: <span id="timeDisplay">0:00</span></p>
    <p>볼륨: <span id="volumeLabel">25%</span></p>
    <input type="range" id="volumeSlider" min="0" max="100" step="5" value="25" oninput="changeVolume(this.value)">

    <div class="container">
        <div class="box" id="box1">
            <h3>팀1</h3>
            <button onclick="selectFolder(1)">폴더 선택</button>
            <input type="file" id="folderInput1" webkitdirectory multiple onchange="loadFiles(event, 1)">
            <div class="fileList"></div>
        </div>
        <div class="box" id="box2">
            <h3>팀2</h3>
            <button onclick="selectFolder(2)">폴더 선택</button>
            <input type="file" id="folderInput2" webkitdirectory multiple onchange="loadFiles(event, 2)">
            <div class="fileList"></div>
        </div>
    </div>
    
    <script>
        function stopAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
                clearInterval(timeUpdater);
                document.getElementById("timeDisplay").textContent = "0:00";
            }
        }
        document.addEventListener("keydown", (event) => {
            if (event.key.toLowerCase() === "p") { stopAudio(); }
        });
    </script>
</body>
</html>
